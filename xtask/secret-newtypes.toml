# Workspace newtype types that legitimately wrap secrets.
# Listed here as either a fully-qualified path
# (e.g., `tanren_identity_policy::SessionToken`) or a leaf type name
# (e.g., `SessionToken`) — `xtask check-secrets` matches against the
# textual rendering of the field type, normalized for whitespace.
#
# Only types used as the declared type of fields whose names match the
# secret-shaped regex belong here. Metadata enums and types used only by
# non-matching field names are intentionally omitted so the AST walker
# still catches future bare-String secret fields.
allowed = [
  "tanren_identity_policy::SessionToken",
  "SessionToken",
  "secrecy::SecretString",
  "secrecy::SecretBox",
  # Organization-secret metadata identifier (R-0011/S-01-contracts).
  # Used as the type of `secret_id` fields that match the regex.
  # UUIDv7 identifier, not a secret value — safe to log and display.
  "tanren_configuration_secrets::OrganizationSecretId",
  "OrganizationSecretId",
]

# Per-(file, field) exemptions for fields whose name is matched by the
# `(?i)password|secret|api_key|...` regex but whose value is *not* a
# secret. The `password_phc` column carries the Argon2id PHC string —
# a public-by-design hash output (parameters + salt + hash) that is
# safe to store as TEXT and to log. Verification routes through
# `CredentialVerifier::verify`; the field never holds plaintext.
[[field_exemptions]]
file = "crates/tanren-store/src/entity/accounts.rs"
field = "password_phc"
ty = "String"
reason = "Argon2id PHC string — hash output, not a secret. Salt is embedded; parameters are recoverable; no plaintext."

[[field_exemptions]]
file = "crates/tanren-store/src/records.rs"
field = "password_phc"
ty = "String"
reason = "Mirrors entity::accounts::Model.password_phc; same PHC-string rationale."

# Organization-secret metadata fields whose names match the regex but
# carry metadata types or views (not raw values).
[[field_exemptions]]
file = "crates/tanren-contract/src/organization_secret.rs"
field = "secrets"
ty = "Vec < OrganizationSecretSummaryView >"
reason = "Vec of metadata-only summary views; no secret values present."

[[field_exemptions]]
file = "crates/tanren-contract/src/organization_secret.rs"
field = "secret"
ty = "OrganizationSecretView"
reason = "Metadata-only view; no secret value field. The view explicitly carries value_redacted: true."

# Organization-secret entity FK columns. These are UUID foreign keys to the
# metadata table, not secret values. The metadata identifier (OrganizationSecretId)
# is already on the allowlist; the raw Uuid in entity models is the SeaORM FK type.
[[field_exemptions]]
file = "crates/tanren-store/src/entity/organization_secret_values.rs"
field = "secret_id"
ty = "Uuid"
reason = "SeaORM FK column pointing to organization_secrets.id. UUID metadata identifier, not a secret value."
